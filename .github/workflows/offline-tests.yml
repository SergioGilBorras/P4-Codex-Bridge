name: Offline tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # Keep runner-level/user configuration out of tests that verify defaults.
      P4_CODEX_BRIDGE_STATE_DIR: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and pinned runtime dependency
        run: python -m pip install .
      - name: Install build backend for offline wheel contract test
        run: python -m pip install setuptools
      - name: Compile
        run: python -m compileall -q p4_codex_bridge tests_py
      - name: Offline test suite
        run: python -m unittest discover -s tests_py -v
