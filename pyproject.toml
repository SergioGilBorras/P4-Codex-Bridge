[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p4-codex-bridge"
dynamic = ["version"]
description = "Shared Python API for Codex CLI execution used by P4 components"
requires-python = ">=3.11"
dependencies = [
  "portable-tempdirs @ git+https://github.com/SergioGilBorras/portable-tempdirs.git@8dfe64c5a60b568cfda1c1fdce0cae4bd6cab275",
]

[project.scripts]
p4-codex = "p4_codex_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["p4_codex_bridge*"]

[tool.setuptools.data-files]
"Scripts" = ["bin/p4-codex.cmd"]

[tool.setuptools.dynamic]
version = {attr = "p4_codex_bridge.__version__"}
